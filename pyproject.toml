[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger"
version = "0.1.0"
description = "AgentLedger — FinOps for AI agents: OpenTelemetry cost attribution, budgets that halt runs, and model routing for LangGraph agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-common==1.45.2",
]

[project.optional-dependencies]
sample = [
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools]
packages = ["agentledger", "sample_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
